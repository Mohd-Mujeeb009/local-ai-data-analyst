[project]
name = "ai-data-analyst"
version = "1.0.0"
description = "Chat with your data. Answers are computed with real pandas, not guessed by an LLM."
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take several seconds"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
